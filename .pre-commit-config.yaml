repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: end-of-file-fixer
      - id: trailing-whitespace
      - id: check-yaml
      - id: check-merge-conflict
      - id: check-added-large-files
        args: ["--maxkb=1024"]

  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.21.2
    hooks:
      - id: gitleaks

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.8.6
    hooks:
      - id: ruff
        files: ^backend/
        args: ["--fix", "--config", "backend/pyproject.toml"]
      - id: ruff-format
        files: ^backend/
        args: ["--config", "backend/pyproject.toml"]

  - repo: local
    hooks:
      - id: mypy
        name: mypy
        entry: uv run --directory backend mypy app
        language: system
        pass_filenames: false
        files: ^backend/.*\.py$
      - id: eslint
        name: eslint
        entry: npm --prefix frontend run lint
        language: system
        pass_filenames: false
        files: ^frontend/src/
      - id: prettier
        name: prettier
        entry: npm --prefix frontend run format:check
        language: system
        pass_filenames: false
        files: ^frontend/
      - id: no-long-dash
        name: forbid long dash character
        entry: python scripts/check_text_rules.py
        language: system
        pass_filenames: false
        always_run: true
