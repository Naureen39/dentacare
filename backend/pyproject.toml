[project]
name = "meridian-dental-backend"
version = "0.1.0"
description = "Meridian Dental Care API"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "gunicorn>=22.0",
    "pydantic>=2.8",
    "pydantic-settings>=2.4",
    "sqlalchemy[asyncio]>=2.0.32",
    "asyncpg>=0.29",
    "alembic>=1.13",
    "redis>=5.0",
    "arq>=0.26",
    "structlog>=24.4",
    "pgvector>=0.5.0",
    "tzdata>=2026.5",
    "pyjwt>=2.15.1",
    "argon2-cffi>=25.1.0",
    "pyotp>=2.10.0",
    "cryptography>=50.0.2",
    "aiosmtplib>=5.1.3",
    "email-validator>=2.3.0",
    "reportlab>=5.0.1",
    "jinja2>=3.1.6",
    "icalendar>=7.3.0",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "pytest-cov>=5.0",
    "httpx>=0.27",
    "ruff>=0.6",
    "mypy>=1.11",
    "bandit[toml]>=1.7",
    "pip-audit>=2.7",
    "fakeredis>=2.39.0",
    "pypdf>=6.19.0",
]

[tool.uv]
package = false

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["app/db/migrations"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "S", "ASYNC", "SIM"]
# Line length is handled by the formatter; long strings and comments are allowed.
ignore = ["E501", "S105", "S106", "S107"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S105", "S106", "S107", "S311"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
exclude = ["app/db/migrations"]

[[tool.mypy.overrides]]
module = ["asyncpg", "asyncpg.*", "pgvector.*", "reportlab", "reportlab.*"]
ignore_missing_imports = true

[tool.bandit]
# Hardcoded password checks fire on identifiers such as token type names; secrets come
# from the environment and gitleaks scans the repository.
skips = ["B105", "B106", "B107"]
# Migrations build SQL only from constants defined in the same file.
exclude_dirs = ["*/db/migrations", "*/db/migrations/*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["."]

[tool.coverage.run]
source = ["app"]
